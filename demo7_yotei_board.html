<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>現場ボード | 柿本ホーム産業（デモ版）</title>
<style>
  :root{
    --kaki:#C9861F;
    --kaki-dark:#A8690F;
    --sumi:#2A2520;
    --kinari:#FAF6EF;
    --midori:#3D5A4C;
    --shu:#B5452E;
    --line:#E6DCC8;
    --line-soft:#EFE8D8;
    --white:#FFFFFF;
    --muted:#7A7062;
    --gray:#9A958C;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Noto Sans JP',sans-serif;
    background:var(--kinari);
    color:var(--sumi);
    font-size:15px;
    line-height:1.7;
  }
  h1,h2,h3,.serif{font-family:'Noto Serif JP',serif;}
  button{font-family:'Noto Sans JP',sans-serif;}

  /* ===== header ===== */
  header{
    background:var(--white);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:1240px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .logo{
    font-family:'Noto Serif JP',serif;
    font-size:20px;font-weight:700;letter-spacing:.06em;
    display:flex;align-items:center;gap:10px;
  }
  .logo-mark{
    width:30px;height:30px;background:var(--kaki);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:16px;font-weight:700;border-radius:4px;flex:none;
    font-family:'Noto Serif JP',serif;
  }
  .tool-name{
    font-family:'Noto Serif JP',serif;
    font-size:16px;font-weight:600;color:var(--kaki-dark);
    border-left:1px solid var(--line);padding-left:14px;letter-spacing:.08em;
  }
  .demo-badge{
    font-size:11px;color:var(--kaki-dark);border:1px solid var(--kaki);
    padding:1px 8px;border-radius:999px;letter-spacing:.1em;white-space:nowrap;
  }
  .header-date{
    margin-left:auto;font-size:12px;color:var(--muted);letter-spacing:.04em;
  }

  /* ===== concept ===== */
  .concept{
    max-width:1240px;margin:0 auto;padding:26px 24px 6px;
  }
  .concept p.catch{
    font-family:'Noto Serif JP',serif;
    font-size:21px;font-weight:600;letter-spacing:.04em;line-height:1.6;
  }
  .concept p.catch .accent{color:var(--kaki-dark);}
  .concept p.sub{font-size:13px;color:var(--muted);margin-top:4px;}

  /* ===== controls ===== */
  .container{max-width:1240px;margin:0 auto;padding:16px 24px 48px;}
  .board-controls{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;
  }
  .week-nav{display:flex;align-items:center;gap:8px;}
  .week-btn{
    background:var(--white);border:1px solid var(--line);border-radius:6px;
    padding:6px 12px;font-size:13px;cursor:pointer;color:var(--sumi);
    display:flex;align-items:center;gap:4px;
    transition:border-color .15s;
  }
  .week-btn:hover{border-color:var(--kaki);color:var(--kaki-dark);}
  .week-label{
    font-family:'Noto Serif JP',serif;
    font-size:16px;font-weight:600;letter-spacing:.04em;min-width:220px;text-align:center;
  }
  .week-sub{
    font-size:11px;color:var(--kaki-dark);border:1px solid var(--kaki);
    border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:middle;
  }
  .btn-morning{
    margin-left:auto;
    background:var(--kaki);color:#fff;border:none;border-radius:6px;
    padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:8px;letter-spacing:.04em;
    transition:background .15s;
  }
  .btn-morning:hover{background:var(--kaki-dark);}
  .btn-morning svg{flex:none;}

  .legend{
    display:flex;gap:14px;flex-wrap:wrap;align-items:center;
    font-size:12px;color:var(--muted);margin-bottom:10px;
  }
  .legend .key{display:flex;align-items:center;gap:5px;}
  .legend .sw{width:12px;height:12px;border-radius:2px;flex:none;}
  .sw.daiku{background:var(--kaki);}
  .sw.setsubi{background:var(--midori);}
  .sw.naiso{background:var(--sumi);}
  .sw.sonota{background:var(--gray);}

  /* ===== layout: pool + board ===== */
  .board-layout{
    display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start;
  }
  @media (max-width:900px){
    .board-layout{grid-template-columns:1fr;}
  }

  /* pool */
  .pool{
    background:var(--white);border:1px solid var(--line);border-radius:10px;
    padding:14px 14px 16px;
  }
  .pool h2{
    font-size:15px;font-weight:600;letter-spacing:.05em;
    display:flex;align-items:center;gap:8px;margin-bottom:4px;
  }
  .pool .hint{font-size:11.5px;color:var(--muted);margin-bottom:10px;line-height:1.6;}
  .pool-list{display:flex;flex-direction:column;gap:8px;min-height:60px;}
  .pool-empty{
    font-size:12px;color:var(--muted);border:1px dashed var(--line);
    border-radius:6px;padding:10px;text-align:center;
  }

  /* board */
  .board-scroll{
    overflow-x:auto;background:var(--white);
    border:1px solid var(--line);border-radius:10px;
    -webkit-overflow-scrolling:touch;
  }
  .board-grid{
    display:grid;
    grid-template-columns:108px repeat(6, minmax(146px, 1fr));
    min-width:1000px;
  }
  .bg-corner, .bg-day{
    background:var(--kinari);border-bottom:2px solid var(--line);
    padding:8px 10px;font-size:12px;
  }
  .bg-corner{
    position:sticky;left:0;z-index:3;
    border-right:1px solid var(--line);
    color:var(--muted);display:flex;align-items:flex-end;
  }
  .bg-day{
    text-align:center;border-left:1px solid var(--line-soft);
  }
  .bg-day .dow{font-size:11px;color:var(--muted);letter-spacing:.1em;display:block;line-height:1.3;}
  .bg-day .dnum{font-family:'Noto Serif JP',serif;font-size:16px;font-weight:600;line-height:1.4;}
  .bg-day.sat .dow, .bg-day.sat .dnum{color:#3A5E8C;}
  .bg-day.today{background:#F6E8CC;}
  .bg-day.today .dnum{color:var(--kaki-dark);}
  .bg-day .today-tag{
    display:inline-block;font-size:10px;color:#fff;background:var(--kaki);
    border-radius:999px;padding:0 7px;margin-left:4px;vertical-align:2px;letter-spacing:.08em;
  }
  .bg-worker{
    position:sticky;left:0;z-index:2;
    background:var(--white);border-right:1px solid var(--line);
    border-top:1px solid var(--line-soft);
    padding:10px;display:flex;flex-direction:column;justify-content:flex-start;gap:2px;
  }
  .bg-worker .wname{
    font-family:'Noto Serif JP',serif;font-size:14.5px;font-weight:600;line-height:1.4;
  }
  .bg-worker .wtrade{font-size:11px;color:var(--muted);line-height:1.3;}
  .cell{
    border-top:1px solid var(--line-soft);border-left:1px solid var(--line-soft);
    min-height:92px;padding:6px;display:flex;flex-direction:column;gap:6px;
    transition:background .12s;
  }
  .cell.today{background:#FCF6E8;}
  .cell.drag-over{background:#F3E3C8;outline:2px dashed var(--kaki);outline-offset:-3px;}

  /* cards */
  .card{
    background:var(--white);border:1px solid var(--line);
    border-left-width:4px;border-radius:5px;
    padding:6px 8px 7px;cursor:grab;user-select:none;
    box-shadow:0 1px 2px rgba(42,37,32,.06);
    transition:box-shadow .12s, border-color .12s;
  }
  .card:hover{box-shadow:0 2px 8px rgba(169,105,15,.18);}
  .card:active{cursor:grabbing;}
  .card.dragging{opacity:.45;}
  .card.k-daiku{border-left-color:var(--kaki);}
  .card.k-setsubi{border-left-color:var(--midori);}
  .card.k-naiso{border-left-color:var(--sumi);}
  .card.k-sonota{border-left-color:var(--gray);}
  .card .c-name{
    font-size:12.5px;font-weight:700;line-height:1.45;letter-spacing:.01em;
  }
  .card .c-meta{
    display:flex;gap:5px;align-items:center;margin-top:4px;flex-wrap:wrap;
  }
  .card .slot{
    font-size:10.5px;font-weight:700;border-radius:3px;padding:0 6px;line-height:1.7;
  }
  .slot.zenjitsu{background:#F3E3C8;color:var(--kaki-dark);}
  .slot.gozen{background:#E2EAE5;color:var(--midori);}
  .slot.gogo{background:#F1E5E1;color:var(--shu);}
  .card .trade{font-size:10.5px;color:var(--muted);}

  /* ===== popover ===== */
  .popover{
    position:fixed;z-index:60;width:300px;max-width:calc(100vw - 24px);
    background:var(--white);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 10px 32px rgba(42,37,32,.22);
    padding:16px 16px 14px;display:none;
  }
  .popover.open{display:block;}
  .popover h3{
    font-size:15px;font-weight:600;letter-spacing:.03em;line-height:1.5;
    padding-right:26px;
  }
  .popover .p-trade{
    display:inline-block;font-size:11px;border-radius:3px;padding:0 8px;
    color:#fff;margin-top:4px;letter-spacing:.06em;
  }
  .p-trade.k-daiku{background:var(--kaki);}
  .p-trade.k-setsubi{background:var(--midori);}
  .p-trade.k-naiso{background:var(--sumi);}
  .p-trade.k-sonota{background:var(--gray);}
  .popover dl{margin-top:10px;}
  .popover dl div{
    display:grid;grid-template-columns:78px 1fr;gap:8px;
    padding:6px 0;border-top:1px solid var(--line-soft);
  }
  .popover dt{
    font-size:11px;color:var(--muted);letter-spacing:.04em;padding-top:2px;
    display:flex;align-items:flex-start;gap:5px;
  }
  .popover dt svg{flex:none;margin-top:3px;}
  .popover dd{font-size:12.5px;line-height:1.6;}
  .popover .p-close{
    position:absolute;top:10px;right:10px;width:26px;height:26px;
    background:none;border:none;cursor:pointer;color:var(--muted);
    display:flex;align-items:center;justify-content:center;border-radius:4px;
  }
  .popover .p-close:hover{background:var(--kinari);color:var(--sumi);}

  /* ===== modal (morning message) ===== */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(42,37,32,.45);z-index:80;
    display:none;align-items:flex-start;justify-content:center;
    padding:32px 16px;overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--white);border-radius:12px;width:680px;max-width:100%;
    padding:24px 26px 26px;position:relative;
    box-shadow:0 16px 48px rgba(42,37,32,.3);
  }
  .modal h2{
    font-size:19px;font-weight:600;letter-spacing:.05em;display:flex;align-items:center;gap:10px;
  }
  .modal .m-sub{font-size:12.5px;color:var(--muted);margin-top:2px;margin-bottom:16px;}
  .modal .m-close{
    position:absolute;top:16px;right:16px;width:32px;height:32px;
    background:none;border:none;cursor:pointer;color:var(--muted);
    display:flex;align-items:center;justify-content:center;border-radius:6px;
  }
  .modal .m-close:hover{background:var(--kinari);color:var(--sumi);}
  .msg-block{
    border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden;
  }
  .msg-head{
    background:var(--kinari);padding:8px 14px;
    display:flex;align-items:center;gap:10px;
  }
  .msg-head b{font-family:'Noto Serif JP',serif;font-size:14.5px;font-weight:600;}
  .msg-head .t{font-size:11px;color:var(--muted);}
  .btn-copy{
    margin-left:auto;background:var(--white);border:1px solid var(--kaki);color:var(--kaki-dark);
    border-radius:5px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:5px;white-space:nowrap;
    transition:background .15s,color .15s;
  }
  .btn-copy:hover{background:var(--kaki);color:#fff;}
  .btn-copy.done{background:var(--midori);border-color:var(--midori);color:#fff;}
  .msg-body{
    padding:12px 14px;font-size:12.5px;line-height:1.8;
    white-space:pre-wrap;font-family:'Noto Sans JP',sans-serif;color:#3B352E;
  }
  .msg-none{
    border:1px dashed var(--line);border-radius:8px;padding:18px;
    text-align:center;font-size:13px;color:var(--muted);
  }

  /* ===== toast ===== */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);
    background:var(--sumi);color:#fff;font-size:13px;letter-spacing:.03em;
    padding:11px 22px;border-radius:8px;box-shadow:0 6px 20px rgba(42,37,32,.3);
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:90;
    display:flex;align-items:center;gap:9px;max-width:calc(100vw - 32px);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast svg{flex:none;}

  /* ===== footer ===== */
  footer{
    border-top:1px solid var(--line);background:var(--white);margin-top:8px;
  }
  .footer-inner{
    max-width:1240px;margin:0 auto;padding:18px 24px;
    display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
    font-size:12px;color:var(--muted);
  }

  @media (max-width:640px){
    .header-date{display:none;}
    .concept p.catch{font-size:18px;}
    .week-label{min-width:0;font-size:14.5px;}
    .btn-morning{margin-left:0;width:100%;justify-content:center;}
    .board-grid{grid-template-columns:92px repeat(6, 150px);}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo"><span class="logo-mark">柿</span>柿本ホーム産業</div>
    <div class="tool-name">現場ボード</div>
    <span class="demo-badge">デモ版</span>
    <div class="header-date" id="headerDate"></div>
  </div>
</header>

<div class="concept">
  <p class="catch">ホワイトボードを、<span class="accent">全員のポケットに。</span></p>
  <p class="sub">事務所の予定表をそのままウェブへ。職人さんは現場からスマホで今日の段取りを確認、変更はその場で全員に伝わります。</p>
</div>

<div class="container">

  <div class="board-controls">
    <div class="week-nav">
      <button class="week-btn" id="prevWeek" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        前週
      </button>
      <div class="week-label" id="weekLabel"></div>
      <button class="week-btn" id="nextWeek" type="button">
        次週
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <button class="btn-morning" id="btnMorning" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/></svg>
      朝の連絡を作成
    </button>
  </div>

  <div class="legend">
    <span>工種の色分け：</span>
    <span class="key"><span class="sw daiku"></span>大工</span>
    <span class="key"><span class="sw setsubi"></span>設備</span>
    <span class="key"><span class="sw naiso"></span>内装</span>
    <span class="key"><span class="sw sonota"></span>塗装・その他</span>
    <span style="margin-left:auto;">カードはドラッグで移動／クリックで現場の詳細</span>
  </div>

  <div class="board-layout">

    <aside class="pool">
      <h2>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A8690F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
        未割当の現場
      </h2>
      <p class="hint">日程が決まっていない現場です。ボードの空きへドラッグすると割り当てられます。</p>
      <div class="pool-list" id="poolList"></div>
    </aside>

    <div class="board-scroll">
      <div class="board-grid" id="boardGrid"></div>
    </div>

  </div>

</div>

<!-- popover -->
<div class="popover" id="popover" role="dialog" aria-label="現場の詳細">
  <button class="p-close" id="popClose" type="button" aria-label="閉じる">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div id="popBody"></div>
</div>

<!-- morning modal -->
<div class="modal-overlay" id="morningOverlay">
  <div class="modal" role="dialog" aria-label="朝の連絡">
    <button class="m-close" id="morningClose" type="button" aria-label="閉じる">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h2>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A8690F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 8.7 8.7 0 0 1-3.7-.8L3 20l1.1-4.1a8.1 8.1 0 0 1-1.1-4.1A8.4 8.4 0 0 1 11.5 3.4 8.4 8.4 0 0 1 21 11.5z"/></svg>
      朝の連絡（LINE送信用）
    </h2>
    <p class="m-sub" id="morningSub"></p>
    <div id="morningBody"></div>
  </div>
</div>

<div class="toast" id="toast">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C9861F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastText"></span>
</div>

<footer>
  <div class="footer-inner">
    <span>このツールはデモです。実製品はLINE連携で自動通知します。</span>
    <span>制作：SafariTech Inc.</span>
  </div>
</footer>

      notes:'既存便器は当日引き取り。止水栓の状態を先に確認。', items:'新規便器（倉庫A棚）・止水プラグ' },
    taka: { name:'都筑区T様邸 和室改修', koushu:'大工',
      address:'横浜市都筑区荏田南3-2-11', customer:'高橋様',
      parking:'敷地内2台可', key:'キーボックス（暗証番号は田中棟梁に確認）',
      notes:'畳の搬出は午前中に。床下の含水率を記録。', items:'造作材一式・床下点検カメラ' },
    okada: { name:'町田市O様 倉庫建方', koushu:'大工',
      address:'東京都町田市小川7-9', customer:'岡田様（岡田工業）',
      parking:'現場敷地内可（大型可）', key:'不要（屋外作業）',
      notes:'レッカー8時着。周辺道路は7時半から誘導員を配置。', items:'建方金物一式・安全帯・誘導旗' },
    hase: { name:'青葉区H様邸 キッチン交換', koushu:'設備',
      address:'横浜市青葉区市ケ尾町11-4', customer:'長谷川様',
      parking:'コインP利用、領収書保管', key:'管理人室で借用（要受領印）',
      notes:'マンション3階。エレベーター養生必須。搬入は9〜12時指定。', items:'エレベーター養生材・台車' },
    yagi: { name:'緑区Y様邸 クロス張替', koushu:'内装',
      address:'横浜市緑区十日市場町8-15', customer:'八木様',
      parking:'敷地内1台可', key:'お客様在宅（インターホン）',
      notes:'家具移動はお客様と相談しながら。猫が2匹、玄関の開け放し注意。', items:'クロス（品番SP-2843）・糊付機' },
    nomura: { name:'都筑区N様邸 玄関ドア交換', koushu:'大工',
      address:'横浜市都筑区中川中央1-30-2', customer:'野村様',
      parking:'前面道路（作業帯申請済）', key:'お客様在宅',
      notes:'カバー工法。既存枠の歪みを当日採寸で最終確認。', items:'新規ドアユニット・シーリング材' },
    fuji: { name:'青葉区F様邸 手すり取付', koushu:'大工',
      address:'横浜市青葉区たちばな台2-6-9', customer:'藤本様',
      parking:'敷地内1台可', key:'お客様在宅',
      notes:'介護保険適用工事。施工前後の写真を必ず撮影。', items:'手すり部材・下地センサー' },
    wata: { name:'緑区W様邸 給湯器交換', koushu:'設備',
      address:'横浜市緑区長津田4-3-17', customer:'渡辺様',
      parking:'近隣コインP利用、領収書保管', key:'不要（屋外設置）',
      notes:'号数アップのためガス配管の径を要確認。', items:'給湯器本体（メーカー直送・9時指定）' },
    aoki: { name:'都筑区A様邸 外壁塗装', koushu:'塗装',
      address:'横浜市都筑区茅ケ崎南2-5-8', customer:'青木様',
      parking:'敷地内1台可', key:'不要（外部作業のみ）',
      notes:'足場は前週土曜に組立済の想定。', items:'下塗り材・養生テープ' }
  };

  /* assignments: week 0 = 今週, 1 = 翌週. day: 0=月 .. 5=土 */
  var seq = 0;
  function A(week, day, worker, site, slot){
    return { id:'a' + (++seq), week:week, day:day, worker:worker, site:site, slot:slot };
  }
  var assignments = [
    /* 今週 */
    A(0,0,'tanaka','taka','終日'),   A(0,1,'tanaka','taka','終日'),
    A(0,2,'tanaka','okada','終日'),  A(0,3,'tanaka','okada','終日'),
    A(0,4,'tanaka','nomura','午前'),
    A(0,0,'yamamoto','taka','終日'), A(0,1,'yamamoto','taka','終日'),
    A(0,2,'yamamoto','okada','終日'),A(0,3,'yamamoto','okada','終日'),
    A(0,4,'yamamoto','nomura','午前'),
    A(0,0,'sasaki','kawa','終日'),   A(0,1,'sasaki','kawa','終日'),
    A(0,2,'sasaki','sato','午前'),   A(0,2,'sasaki','hase','午後'),
    A(0,3,'sasaki','hase','終日'),   A(0,4,'sasaki','kawa','終日'),
    A(0,0,'kobayashi','yagi','終日'),A(0,1,'kobayashi','yagi','終日'),
    A(0,2,'kobayashi','yagi','午前'),A(0,3,'kobayashi','taka','終日'),
    A(0,4,'kobayashi','taka','終日'),
    A(0,2,'ouen','okada','終日'),    A(0,3,'ouen','okada','終日'),
    A(0,4,'ouen','mori','終日'),     A(0,5,'ouen','mori','終日'),
    /* 翌週 */
    A(1,0,'tanaka','okada','終日'),
    A(1,0,'sasaki','kawa','午前'),
    A(1,1,'ouen','aoki','終日')
  ];

  var pool = ['fuji', 'wata'];   /* 未割当 */
  var weekOffset = 0;

  /* ===== date utils ===== */
  var DOW = ['日','月','火','水','木','金','土'];
  function mondayOf(offset){
    var d = new Date();
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + offset * 7);
    return d;
  }
  function addDays(date, n){
    var d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  }
  function fmtMD(d){ return (d.getMonth()+1) + '月' + d.getDate() + '日'; }
  function todayDayIndex(){
    return (new Date().getDay() + 6) % 7;   /* 月=0 .. 日=6 */
  }

  /* ===== dom refs ===== */
  var boardGrid  = document.getElementById('boardGrid');
  var poolList   = document.getElementById('poolList');
  var weekLabel  = document.getElementById('weekLabel');
  var popover    = document.getElementById('popover');
  var popBody    = document.getElementById('popBody');
  var toastEl    = document.getElementById('toast');
  var toastText  = document.getElementById('toastText');
  var morningOverlay = document.getElementById('morningOverlay');
  var morningBody    = document.getElementById('morningBody');
  var morningSub     = document.getElementById('morningSub');

  document.getElementById('headerDate').textContent =
    (function(){ var d = new Date(); return d.getFullYear() + '年' + fmtMD(d) + '（' + DOW[d.getDay()] + '）'; })();

  /* ===== render ===== */
  var SLOT_CLASS = { '終日':'zenjitsu', '午前':'gozen', '午後':'gogo' };

  function cardHTML(a){
    var s = SITES[a.site];
    return '<div class="card ' + KOUSHU_CLASS[s.koushu] + '" draggable="true" data-aid="' + a.id + '" data-site="' + a.site + '">' +
      '<div class="c-name">' + s.name + '</div>' +
      '<div class="c-meta"><span class="slot ' + SLOT_CLASS[a.slot] + '">' + a.slot + '</span>' +
      '<span class="trade">' + s.koushu + '</span></div></div>';
  }

  function render(){
    var monday = mondayOf(weekOffset);
    var saturday = addDays(monday, 5);
    weekLabel.innerHTML = fmtMD(monday) + '（月）〜 ' + fmtMD(saturday) + '（土）' +
      (weekOffset === 0 ? '<span class="week-sub">今週</span>' : (weekOffset === 1 ? '<span class="week-sub">翌週</span>' : ''));

    var tIdx = (weekOffset === 0) ? todayDayIndex() : -1;

    var html = '<div class="bg-corner">職人</div>';
    for (var d = 0; d < 6; d++){
      var date = addDays(monday, d);
      var cls = 'bg-day' + (d === 5 ? ' sat' : '') + (d === tIdx ? ' today' : '');
      html += '<div class="' + cls + '"><span class="dow">' + DOW[date.getDay()] + '曜</span>' +
        '<span class="dnum">' + (date.getMonth()+1) + '/' + date.getDate() + '</span>' +
        (d === tIdx ? '<span class="today-tag">今日</span>' : '') + '</div>';
    }

    WORKERS.forEach(function(w){
      html += '<div class="bg-worker"><span class="wname">' + w.name + '</span><span class="wtrade">' + w.trade + '</span></div>';
      for (var d = 0; d < 6; d++){
        var cards = assignments.filter(function(a){
          return a.week === weekOffset && a.worker === w.id && a.day === d;
        }).map(cardHTML).join('');
        html += '<div class="cell' + (d === tIdx ? ' today' : '') + '" data-worker="' + w.id + '" data-day="' + d + '">' + cards + '</div>';
      }
    });
    boardGrid.innerHTML = html;

    poolList.innerHTML = pool.length
      ? pool.map(function(siteId){
          var s = SITES[siteId];
          return '<div class="card ' + KOUSHU_CLASS[s.koushu] + '" draggable="true" data-pool="' + siteId + '" data-site="' + siteId + '">' +
            '<div class="c-name">' + s.name + '</div>' +
            '<div class="c-meta"><span class="trade">' + s.koushu + '・日程未定</span></div></div>';
        }).join('')
      : '<div class="pool-empty">未割当の現場はありません</div>';
  }

  /* ===== drag and drop ===== */
  var dragData = null;       /* {type:'assign', id} or {type:'pool', siteId} */
  var suppressClick = false;

  document.addEventListener('dragstart', function(e){
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (!card) return;
    if (card.dataset.aid){
      dragData = { type:'assign', id:card.dataset.aid };
    } else if (card.dataset.pool){
      dragData = { type:'pool', siteId:card.dataset.pool };
    } else { return; }
    suppressClick = true;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', card.dataset.aid || card.dataset.pool); } catch(err){}
    closePopover();
  });

  document.addEventListener('dragend', function(e){
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (card) card.classList.remove('dragging');
    dragData = null;
    setTimeout(function(){ suppressClick = false; }, 50);
    var over = boardGrid.querySelector('.cell.drag-over');
    if (over) over.classList.remove('drag-over');
  });

  boardGrid.addEventListener('dragover', function(e){
    var cell = e.target.closest('.cell');
    if (!cell || !dragData) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    var prev = boardGrid.querySelector('.cell.drag-over');
    if (prev && prev !== cell) prev.classList.remove('drag-over');
    cell.classList.add('drag-over');
  });

  boardGrid.addEventListener('dragleave', function(e){
    var cell = e.target.closest('.cell');
    if (cell && !cell.contains(e.relatedTarget)) cell.classList.remove('drag-over');
  });

  boardGrid.addEventListener('drop', function(e){
    var cell = e.target.closest('.cell');
    if (!cell || !dragData) return;
    e.preventDefault();
    cell.classList.remove('drag-over');
    var worker = cell.dataset.worker;
    var day = parseInt(cell.dataset.day, 10);

    if (dragData.type === 'assign'){
      var a = assignments.find(function(x){ return x.id === dragData.id; });
      if (!a) return;
      if (a.worker === worker && a.day === day && a.week === weekOffset){ dragData = null; return; }
      a.worker = worker; a.day = day; a.week = weekOffset;
    } else {
      var siteId = dragData.siteId;
      pool = pool.filter(function(s){ return s !== siteId; });
      assignments.push(A(weekOffset, day, worker, siteId, '終日'));
    }
    dragData = null;
    render();
    showToast('予定を変更しました。関係者に通知されます');
  });

  /* ===== toast ===== */
  var toastTimer = null;
  function showToast(msg){
    toastText.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
  }

  /* ===== popover ===== */
  var ICONS = {
    pin:  '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A8690F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    user: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A8690F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
    car:  '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A8690F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11"/><rect x="3" y="11" width="18" height="6" rx="2"/><circle cx="7.5" cy="17" r="1.6"/><circle cx="16.5" cy="17" r="1.6"/></svg>',
    key:  '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A8690F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3"/><path d="M16 7l3 3"/><path d="M14 9l2 2"/></svg>',
    note: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A8690F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 1 21h22L12 2z"/><line x1="12" y1="9" x2="12" y2="14"/><line x1="12" y1="17" x2="12" y2="17.5"/></svg>',
    bag:  '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A8690F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'
  };

  function openPopover(siteId, anchorRect){
    var s = SITES[siteId];
    popBody.innerHTML =
      '<h3>' + s.name + '</h3>' +
      '<span class="p-trade ' + KOUSHU_CLASS[s.koushu] + '">' + s.koushu + '</span>' +
      '<dl>' +
      '<div><dt>' + ICONS.pin + '住所</dt><dd>' + s.address + '</dd></div>' +
      '<div><dt>' + ICONS.user + 'お客様</dt><dd>' + s.customer + '</dd></div>' +
      '<div><dt>' + ICONS.car + '駐車場</dt><dd>' + s.parking + '</dd></div>' +
      '<div><dt>' + ICONS.key + '鍵</dt><dd>' + s.key + '</dd></div>' +
      '<div><dt>' + ICONS.bag + '持ち物</dt><dd>' + s.items + '</dd></div>' +
      '<div><dt>' + ICONS.note + '注意事項</dt><dd>' + s.notes + '</dd></div>' +
      '</dl>';
    popover.classList.add('open');
    var pw = popover.offsetWidth, ph = popover.offsetHeight;
    var left = anchorRect.left;
    var top  = anchorRect.bottom + 8;
    if (left + pw > window.innerWidth - 12) left = window.innerWidth - pw - 12;
    if (left < 12) left = 12;
    if (top + ph > window.innerHeight - 12) top = anchorRect.top - ph - 8;
    if (top < 12) top = 12;
    popover.style.left = left + 'px';
    popover.style.top  = top + 'px';
  }
  function closePopover(){ popover.classList.remove('open'); }

  document.addEventListener('click', function(e){
    if (popover.contains(e.target)) return;
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (card && !suppressClick){
      openPopover(card.dataset.site, card.getBoundingClientRect());
      return;
    }
    closePopover();
  });
  document.getElementById('popClose').addEventListener('click', closePopover);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ closePopover(); closeMorning(); }
  });
  window.addEventListener('scroll', closePopover, true);

  /* ===== morning message ===== */
  function buildMorningTexts(){
    var d = new Date();
    var dayIdx = todayDayIndex();
    var dateLabel = fmtMD(d) + '（' + DOW[d.getDay()] + '）';
    if (dayIdx > 5){
      return { dateLabel: dateLabel, sunday: true, blocks: [] };
    }
    var blocks = WORKERS.map(function(w){
      var todays = assignments.filter(function(a){
        return a.week === 0 && a.day === dayIdx && a.worker === w.id;
      });
      /* 午前→午後の順、終日を先頭に */
      var order = { '終日':0, '午前':1, '午後':2 };
      todays.sort(function(a,b){ return order[a.slot] - order[b.slot]; });
      var lines = ['【' + dateLabel + ' ' + w.name + '】', 'おはようございます。本日の予定です。'];
      if (todays.length === 0){
        lines.push('本日の現場予定はありません。事務所で段取り・片付けをお願いします。');
      } else {
        todays.forEach(function(a){
          var s = SITES[a.site];
          lines.push('・' + s.name + '（' + a.slot + '）');
          lines.push('　住所：' + s.address);
          lines.push('　持ち物：' + s.items);
          lines.push('　注意：' + s.notes + '／駐車：' + s.parking);
        });
      }
      lines.push('変更があれば事務所までお願いします。');
      return { worker: w, count: todays.length, text: lines.join('\n') };
    });
    return { dateLabel: dateLabel, sunday: false, blocks: blocks };
  }

  function openMorning(){
    var data = buildMorningTexts();
    morningSub.textContent = data.dateLabel + 'の予定を職人ごとに整理しました。コピーしてLINEに貼り付けてください。';
    if (data.sunday){
      morningBody.innerHTML = '<div class="msg-none">本日は日曜のため現場予定はありません。<br>月曜の予定は週間ボードをご確認ください。</div>';
    } else {
      morningBody.innerHTML = data.blocks.map(function(b, i){
        return '<div class="msg-block">' +
          '<div class="msg-head"><b>' + b.worker.name + '</b>' +
          '<span class="t">' + (b.count > 0 ? '本日 ' + b.count + '件' : '現場なし') + '</span>' +
          '<button class="btn-copy" type="button" data-copy="' + i + '">' +
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
          'コピー</button></div>' +
          '<div class="msg-body"></div></div>';
      }).join('');
      var bodies = morningBody.querySelectorAll('.msg-body');
      data.blocks.forEach(function(b, i){ bodies[i].textContent = b.text; });
      morningBody.querySelectorAll('.btn-copy').forEach(function(btn){
        btn.addEventListener('click', function(){
          var i = parseInt(btn.dataset.copy, 10);
          copyText(data.blocks[i].text, btn);
        });
      });
    }
    morningOverlay.classList.add('open');
  }
  function closeMorning(){ morningOverlay.classList.remove('open'); }

  function copyText(text, btn){
    function done(){
      btn.classList.add('done');
      btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>コピーしました';
      setTimeout(function(){
        btn.classList.remove('done');
        btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>コピー';
      }, 1800);
    }
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch(err){ showToast('コピーできませんでした'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }
  }

  document.getElementById('btnMorning').addEventListener('click', openMorning);
  document.getElementById('morningClose').addEventListener('click', closeMorning);
  morningOverlay.addEventListener('click', function(e){
    if (e.target === morningOverlay) closeMorning();
  });

  /* ===== week nav ===== */
  document.getElementById('prevWeek').addEventListener('click', function(){
    weekOffset--; closePopover(); render();
  });
  document.getElementById('nextWeek').addEventListener('click', function(){
    weekOffset++; closePopover(); render();
  });

  render();
})();
</script>
<script>
/* suite embed mode: hide own header when loaded inside a product suite */
if (new URLSearchParams(location.search).has('embed')) {
  document.addEventListener('DOMContentLoaded', function(){
    var h = document.querySelector('header');
    if (h) h.style.display = 'none';
  });
}
</script>
