<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBカルテ | 柿本ホーム産業（デモ版）</title>
<style>
  :root {
    --kaki: #C9861F;
    --kaki-dark: #A8690F;
    --sumi: #2A2520;
    --kinari: #FAF6EF;
    --line: #E6DCC8;
    --muted: #7A7062;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    color: var(--sumi);
    background: var(--kinari);
    display: flex; flex-direction: column;
  }
  header {
    background: #fff; border-bottom: 1px solid var(--line); flex: none;
  }
  .head-inner {
    max-width: 1280px; margin: 0 auto; padding: 12px 24px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .logo {
    font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 19px; font-weight: 700; letter-spacing: .06em;
    display: flex; align-items: center; gap: 10px;
  }
  .logo-mark {
    width: 28px; height: 28px; background: var(--kaki); color: #fff; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 15px; flex: none;
  }
  .product {
    font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 16px; font-weight: 600; color: var(--kaki-dark);
    border-left: 1px solid var(--line); padding-left: 14px; letter-spacing: .08em;
  }
  .badge {
    font-size: 11px; color: var(--kaki-dark); border: 1px solid var(--kaki);
    padding: 1px 8px; border-radius: 999px; letter-spacing: .1em; white-space: nowrap;
  }
  .tagline { margin-left: auto; font-size: 12px; color: var(--muted); }

  .tabs {
    background: #fff; border-bottom: 2px solid var(--line); flex: none;
  }
  .tabs-inner { max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; gap: 4px; }
  .tab {
    font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif; background: none; border: none; cursor: pointer;
    font-size: 14.5px; font-weight: 600; color: var(--muted);
    padding: 10px 20px 8px; letter-spacing: .06em;
    border-bottom: 3px solid transparent; margin-bottom: -2px;
  }
  .tab .who {
    display: block; font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; font-weight: 500;
    font-size: 10px; color: #b0a692; letter-spacing: .08em;
  }
  .tab.active { color: var(--sumi); border-bottom-color: var(--kaki); }
  .tab.active .who { color: var(--kaki-dark); }
  .tab:hover { color: var(--kaki-dark); }

  iframe { flex: 1; width: 100%; border: none; background: var(--kinari); }
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="logo"><span class="logo-mark">柿</span>柿本ホーム産業</div>
    <span class="product">OBカルテ</span>
    <span class="badge">デモ版</span>
    <span class="tagline">顧客台帳から見積・補助金・受注・メンテフォローまで、営業の基幹を一本に</span>
  </div>
</header>
<div class="tabs">
  <div class="tabs-inner">
    <button class="tab active" data-src="demo3_ob_karte.html?embed=1">
      顧客台帳・フォロー・見積管理<span class="who">CRM本体（Excel取り込み対応）</span>
    </button>
    <button class="tab" data-src="demo4_mitsumorisho.html?embed=1">
      見積書・請求書づくり<span class="who">明細サジェスト・帳票印刷</span>
    </button>
    <button class="tab" data-src="demo5_hojokin.html?embed=1">
      補助金チェック<span class="who">商談中にその場で判定</span>
    </button>  </div>
</div>
<iframe id="frame" src="demo3_ob_karte.html?embed=1" title="デモ画面"></iframe>
<script>
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('frame').src = t.dataset.src;
    });
  });
</script>
</body>
</html>
